<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Period & Life Calendar</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --cream: #faf7f2;
            --warm: #f2ede4;
            --bark: #5c4a3a;
            --muted: #9e8f84;
            --today: #c26b5a;
            
            /* Regular event colors */
            --personal: #4CAF50;
            --work: #FFC107;
            --social: #9C27B0;
            
            /* Background marker colors */
            --period: #d9534f;
            --shower: #95a5a6;
            --laundry: #5bc0de;
            --orange: #ff9800;
            --pink: #e91e8c;
            
            /* Background marker light versions */
            --period-light: #f9dedd;
            --shower-light: #eaecee;
            --laundry-light: #ddf0f7;
            --orange-light: #fff3e0;
            --pink-light: #fce4ec;
        }

        body {
            background: var(--cream);
            font-family: 'DM Sans', sans-serif;
            min-height: 100vh;
        }

        .cal-wrap {
            max-width: 760px;
            margin: 0 auto;
            padding: 2rem 1.25rem 4rem;
        }

        .header {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            margin-bottom: 2.5rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid #ddd5c8;
        }

        .month-name {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2rem, 6vw, 2.8rem);
            font-weight: 400;
            color: var(--bark);
            line-height: 1;
        }

        .month-name em {
            font-style: italic;
            color: #7a9e7e;
        }

        .year-tag {
            font-size: 0.75rem;
            font-weight: 300;
            letter-spacing: 0.2em;
            color: var(--muted);
            text-transform: uppercase;
            margin-bottom: 0.25rem;
        }

        .nav-btns {
            display: flex;
            gap: 8px;
        }

        .nav-btn {
            width: 38px;
            height: 38px;
            border: 1px solid #ddd5c8;
            background: white;
            border-radius: 50%;
            font-size: 1.1rem;
            color: var(--bark);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .nav-btn:hover {
            background: var(--warm);
            border-color: #7a9e7e;
        }

        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            margin-bottom: 4px;
        }

        .wd {
            text-align: center;
            font-size: 0.65rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--muted);
            font-weight: 500;
            padding: 0.5rem 0;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }

        .day-cell {
            aspect-ratio: 1;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 0.5rem 0.25rem 0.35rem;
            cursor: pointer;
            transition: all 0.18s ease;
            background: white;
            border: 1px solid #ede6dc;
            position: relative;
            min-height: 52px;
        }

        .day-cell:hover {
            background: var(--warm);
            border-color: #7a9e7e;
            transform: translateY(-1px);
        }
        .day-cell.empty {
            background: transparent !important;
            border-color: transparent !important;
            cursor: default;
            pointer-events: none;
        }

        .day-num {
            font-family: 'Playfair Display', serif;
            font-size: clamp(0.85rem, 2vw, 1.05rem);
            color: var(--bark);
            line-height: 1;
            position: relative;
            z-index: 1;
            text-shadow: 0 0 4px rgba(255, 255, 255, 0.6);
        }

        .day-cell.today {
            border-color: var(--today);
            border-width: 2px;
        }
        .day-cell.today .day-num {
            font-weight: 600;
        }

        /* ----- Background marker styles ----- */
        .day-cell.period-bg {
            background: var(--period-light);
            border-color: var(--period);
        }
        .day-cell.period-bg .day-num {
            color: #7a2a28;
        }

        .day-cell.shower-bg {
            background: var(--shower-light);
            border-color: var(--shower);
        }
        .day-cell.shower-bg .day-num {
            color: #4a5556;
        }

        .day-cell.laundry-bg {
            background: var(--laundry-light);
            border-color: var(--laundry);
        }
        .day-cell.laundry-bg .day-num {
            color: #1a6b7a;
        }

        .day-cell.orange-bg {
            background: var(--orange-light);
            border-color: var(--orange);
        }
        .day-cell.orange-bg .day-num {
            color: #7a4a0a;
        }

        .day-cell.pink-bg {
            background: var(--pink-light);
            border-color: var(--pink);
        }
        .day-cell.pink-bg .day-num {
            color: #7a1a4a;
        }

        /* combined with today */
        .day-cell.period-bg.today {
            background: #f5c8c6;
            border-color: #c0392b;
        }
        .day-cell.shower-bg.today {
            background: #d5d8d9;
            border-color: #6b7a7c;
        }
        .day-cell.laundry-bg.today {
            background: #c8e8f0;
            border-color: #2b8c9e;
        }
        .day-cell.orange-bg.today {
            background: #ffe0b2;
            border-color: #e65100;
        }
        .day-cell.pink-bg.today {
            background: #f8bbd0;
            border-color: #ad1457;
        }

        /* Dots */
        .dots {
            display: flex;
            gap: 3px;
            margin-top: 3px;
            flex-wrap: wrap;
            justify-content: center;
            position: relative;
            z-index: 1;
        }

        .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        .dot.personal {
            background: var(--personal);
        }
        .dot.work {
            background: var(--work);
        }
        .dot.social {
            background: var(--social);
        }
        .dot.period {
            background: var(--period);
        }
        .dot.shower {
            background: var(--shower);
        }
        .dot.laundry {
            background: var(--laundry);
        }
        .dot.orange {
            background: var(--orange);
        }
        .dot.pink {
            background: var(--pink);
        }

        .day-cell.today .dot {
            border-color: rgba(255, 255, 255, 0.7);
        }

        /* Panel */
        .panel {
            margin-top: 2rem;
            background: white;
            border-radius: 16px;
            border: 1px solid #ede6dc;
            padding: 1.5rem;
        }

        .panel-date {
            font-family: 'Playfair Display', serif;
            font-size: 1.3rem;
            color: var(--bark);
            margin-bottom: 1rem;
        }
        .panel-date span {
            font-style: italic;
            color: #7a9e7e;
            font-size: 1rem;
        }

        .section-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--muted);
            margin: 1rem 0 0.5rem 0;
            padding-bottom: 0.3rem;
            border-bottom: 1px solid #f0e9e0;
            font-weight: 500;
        }
        .section-title:first-of-type {
            margin-top: 0;
        }

        .event-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0.5rem 0;
            border-bottom: 1px solid #f0e9e0;
        }
        .event-item:last-child {
            border-bottom: none;
        }

        .event-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
            border: 1px solid rgba(0, 0, 0, 0.08);
        }
        .event-title {
            font-size: 0.9rem;
            color: var(--bark);
            flex: 1;
        }
        .event-time {
            font-size: 0.75rem;
            color: var(--muted);
            font-weight: 300;
            white-space: nowrap;
        }
        .event-cat-label {
            font-size: 0.55rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: 500;
            color: white;
            flex-shrink: 0;
        }
        .event-cat-label.personal {
            background: var(--personal);
        }
        .event-cat-label.work {
            background: var(--work);
            color: #333;
        }
        .event-cat-label.social {
            background: var(--social);
        }
        .event-cat-label.period {
            background: var(--period);
        }
        .event-cat-label.shower {
            background: var(--shower);
        }
        .event-cat-label.laundry {
            background: var(--laundry);
        }
        .event-cat-label.orange {
            background: var(--orange);
        }
        .event-cat-label.pink {
            background: var(--pink);
        }

        .no-events {
            font-size: 0.85rem;
            color: var(--muted);
            font-style: italic;
            text-align: center;
            padding: 1rem 0;
        }

        .add-form {
            margin-top: 1rem;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .add-form input,
        .add-form select {
            border: 1px solid #ddd5c8;
            border-radius: 8px;
            padding: 0.5rem 0.75rem;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.85rem;
            color: var(--bark);
            background: var(--cream);
            outline: none;
            -webkit-appearance: none;
        }
        .add-form input:focus,
        .add-form select:focus {
            border-color: #7a9e7e;
        }
        .add-form input[type="text"] {
            flex: 1;
            min-width: 110px;
        }
        .add-form input[type="time"] {
            width: 100px;
        }
        .add-form select {
            min-width: 130px;
        }

        .add-btn {
            background: #7a9e7e;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 0.5rem 1.2rem;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.85rem;
            cursor: pointer;
            transition: background 0.2s;
            white-space: nowrap;
        }
        .add-btn:hover {
            background: #6a8e6e;
        }

        .del-btn {
            background: none;
            border: none;
            color: var(--muted);
            cursor: pointer;
            font-size: 0.85rem;
            padding: 2px 6px;
            border-radius: 4px;
            transition: color 0.15s;
            flex-shrink: 0;
        }
        .del-btn:hover {
            color: var(--period);
        }

        .legend {
            display: flex;
            gap: 1.2rem;
            margin-top: 1.5rem;
            flex-wrap: wrap;
            padding-top: 1rem;
            border-top: 1px solid #ede6dc;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            color: var(--bark);
            font-weight: 400;
        }
        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 1px solid rgba(0, 0, 0, 0.06);
        }
        .legend-dot.personal {
            background: var(--personal);
        }
        .legend-dot.work {
            background: var(--work);
        }
        .legend-dot.social {
            background: var(--social);
        }
        .legend-dot.period {
            background: var(--period);
        }
        .legend-dot.shower {
            background: var(--shower);
        }
        .legend-dot.laundry {
            background: var(--laundry);
        }
        .legend-dot.orange {
            background: var(--orange);
        }
        .legend-dot.pink {
            background: var(--pink);
        }

        .saved-note {
            font-size: 0.7rem;
            color: var(--muted);
            text-align: right;
            margin-top: 0.5rem;
            font-style: italic;
            opacity: 0;
            transition: opacity 0.4s;
        }
        .saved-note.show {
            opacity: 1;
        }

        .clear-day-btn {
            background: none;
            border: 1px solid #ddd5c8;
            border-radius: 6px;
            padding: 0.3rem 0.9rem;
            font-size: 0.7rem;
            color: var(--muted);
            cursor: pointer;
            transition: all 0.15s;
            margin-top: 0.5rem;
            font-family: 'DM Sans', sans-serif;
        }
        .clear-day-btn:hover {
            border-color: var(--period);
            color: var(--period);
        }

        @media (max-width: 480px) {
            .cal-wrap {
                padding: 1rem 0.75rem 3rem;
            }
            .day-cell {
                border-radius: 8px;
                padding: 0.3rem 0.1rem;
                min-height: 44px;
            }
            .add-form {
                gap: 6px;
            }
            .panel {
                padding: 1rem;
            }
            .add-form input[type="text"] {
                min-width: 80px;
            }
            .add-form select {
                min-width: 100px;
            }
            .add-form input[type="time"] {
                width: 85px;
            }
            .legend {
                gap: 0.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="cal-wrap">
        <div class="header">
            <div>
                <div class="year-tag" id="year-tag"></div>
                <div class="month-name" id="month-display"></div>
            </div>
            <div class="nav-btns">
                <button class="nav-btn" onclick="changeMonth(-1)">&#8249;</button>
                <button class="nav-btn" onclick="changeMonth(1)">&#8250;</button>
            </div>
        </div>

        <div class="weekdays">
            <div class="wd">Sun</div><div class="wd">Mon</div><div class="wd">Tue</div>
            <div class="wd">Wed</div><div class="wd">Thu</div><div class="wd">Fri</div><div class="wd">Sat</div>
        </div>

        <div class="grid" id="cal-grid"></div>

        <div class="panel" id="day-panel">
            <div class="panel-date" id="panel-date">Select a day to track</div>
            <div id="events-list"><div class="no-events">Click any day to add events or markers</div></div>
        </div>

        <div id="saved-note" class="saved-note">&#10003; Saved to your device</div>

        <div class="legend">
            <div class="legend-item"><div class="legend-dot personal"></div>Personal</div>
            <div class="legend-item"><div class="legend-dot work"></div>Work</div>
            <div class="legend-item"><div class="legend-dot social"></div>Social</div>
            <div class="legend-item"><div class="legend-dot period"></div>Period</div>
            <div class="legend-item"><div class="legend-dot shower"></div>Shower</div>
            <div class="legend-item"><div class="legend-dot laundry"></div>Laundry</div>
            <div class="legend-item"><div class="legend-dot orange"></div>Orange</div>
            <div class="legend-item"><div class="legend-dot pink"></div>Pink</div>
        </div>
    </div>

    <script>
        const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October',
            'November', 'December'
        ];
        const DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

        // All categories with their properties
        const CATEGORIES = {
            personal: { label: 'Personal', color: '#4CAF50', cssClass: 'personal', isBackground: false },
            work: { label: 'Work', color: '#FFC107', cssClass: 'work', isBackground: false },
            social: { label: 'Social', color: '#9C27B0', cssClass: 'social', isBackground: false },
            period: { label: 'Period', color: '#d9534f', cssClass: 'period', isBackground: true },
            shower: { label: 'Shower', color: '#95a5a6', cssClass: 'shower', isBackground: true },
            laundry: { label: 'Laundry', color: '#5bc0de', cssClass: 'laundry', isBackground: true },
            orange: { label: 'Orange', color: '#ff9800', cssClass: 'orange', isBackground: true },
            pink: { label: 'Pink', color: '#e91e8c', cssClass: 'pink', isBackground: true }
        };

        // Background categories (for the "no priority" rule)
        const BG_CATEGORIES = ['period', 'shower', 'laundry', 'orange', 'pink'];

        const STORAGE_KEY = 'period_life_calendar_events';

        const today = new Date();
        let cur = { y: today.getFullYear(), m: today.getMonth() };
        let selected = null;
        let events = {};

        function loadEvents() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) events = JSON.parse(saved);
            } catch (e) { events = {}; }
        }

        function saveEvents() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(events));
                const note = document.getElementById('saved-note');
                note.classList.add('show');
                setTimeout(() => note.classList.remove('show'), 2000);
            } catch (e) {}
        }

        function key(y, m, d) { return `${y}-${m}-${d}`; }

        function getDayEvents(y, m, d) {
            const k = key(y, m, d);
            return events[k] || [];
        }

        // Returns the last background category added to a day, or null
        function getBackgroundCategory(evs) {
            if (!evs || evs.length === 0) return null;
            // Find the last background marker in the array
            for (let i = evs.length - 1; i >= 0; i--) {
                if (BG_CATEGORIES.includes(evs[i].cat)) {
                    return evs[i].cat;
                }
            }
            return null;
        }

        function render() {
            const grid = document.getElementById('cal-grid');
            grid.innerHTML = '';
            document.getElementById('month-display').innerHTML = `<em>${MONTHS[cur.m]}</em>`;
            document.getElementById('year-tag').textContent = cur.y;

            const first = new Date(cur.y, cur.m, 1).getDay();
            const days = new Date(cur.y, cur.m + 1, 0).getDate();

            for (let i = 0; i < first; i++) {
                const e = document.createElement('div');
                e.className = 'day-cell empty';
                grid.appendChild(e);
            }

            for (let d = 1; d <= days; d++) {
                const k = key(cur.y, cur.m, d);
                const evs = getDayEvents(cur.y, cur.m, d);
                const isToday = cur.y === today.getFullYear() && cur.m === today.getMonth() && d === today.getDate();
                const bgCat = getBackgroundCategory(evs);

                const cell = document.createElement('div');
                let cls = 'day-cell';
                if (isToday) cls += ' today';
                if (bgCat) {
                    cls += ' ' + bgCat + '-bg';
                }
                cell.className = cls;

                const num = document.createElement('div');
                num.className = 'day-num';
                num.textContent = d;
                cell.appendChild(num);

                if (evs.length > 0) {
                    const dotsEl = document.createElement('div');
                    dotsEl.className = 'dots';
                    const shown = evs.slice(0, 4);
                    shown.forEach(ev => {
                        const dot = document.createElement('div');
                        const catClass = ev.cat;
                        dot.className = `dot ${catClass}`;
                        dotsEl.appendChild(dot);
                    });
                    if (evs.length > 4) {
                        const more = document.createElement('span');
                        more.style.cssText =
                            'font-size:0.5rem;color:#9e8f84;font-weight:500;margin-left:1px;';
                        more.textContent = `+${evs.length - 4}`;
                        dotsEl.appendChild(more);
                    }
                    cell.appendChild(dotsEl);
                }

                const dd = d;
                cell.addEventListener('click', () => selectDay(cur.y, cur.m, dd));
                grid.appendChild(cell);
            }

            if (selected && selected.y === cur.y && selected.m === cur.m) {
                renderEvents(key(selected.y, selected.m, selected.d));
            } else if (selected) {
                document.getElementById('panel-date').innerHTML = 'Select a day to track';
                document.getElementById('events-list').innerHTML =
                    `<div class="no-events">Click any day to add events or markers</div>`;
            }
        }

        function selectDay(y, m, d) {
            selected = { y, m, d };
            const k = key(y, m, d);
            const isToday = y === today.getFullYear() && m === today.getMonth() && d === today.getDate();
            const dow = new Date(y, m, d).getDay();

            document.getElementById('panel-date').innerHTML =
                `${DAYS[dow]}, ${MONTHS[m]} ${d}${isToday ? ' <span>— today</span>' : ''}`;

            renderEvents(k);
        }

        function renderEvents(k) {
            const list = document.getElementById('events-list');
            const evs = events[k] || [];

            // Split into regular events and background markers
            const regularEvents = evs.filter(ev => !BG_CATEGORIES.includes(ev.cat));
            const backgroundMarkers = evs.filter(ev => BG_CATEGORIES.includes(ev.cat));

            let html = '';

            // Regular Events section
            html += `<div class="section-title">Regular Events</div>`;
            if (regularEvents.length === 0) {
                html += `<div class="no-events">No regular events</div>`;
            } else {
                regularEvents.forEach((ev, i) => {
                    const catInfo = CATEGORIES[ev.cat] || CATEGORIES.personal;
                    // Find the actual index in the full events array
                    const actualIndex = evs.indexOf(ev);
                    html += `
                            <div class="event-item">
                                <div class="event-dot" style="background:${catInfo.color}"></div>
                                <div class="event-title">${escHtml(ev.title || catInfo.label)}</div>
                                ${ev.time ? `<div class="event-time">${escHtml(ev.time)}</div>` : ''}
                                <span class="event-cat-label ${ev.cat}">${catInfo.label}</span>
                                <button class="del-btn" onclick="delEvent('${k}',${actualIndex})" title="Remove">&#10005;</button>
                            </div>`;
                });
            }

            // Background Markers section
            html += `<div class="section-title">Background Markers</div>`;
            if (backgroundMarkers.length === 0) {
                html += `<div class="no-events">No background markers</div>`;
            } else {
                backgroundMarkers.forEach((ev, i) => {
                    const catInfo = CATEGORIES[ev.cat] || CATEGORIES.period;
                    const actualIndex = evs.indexOf(ev);
                    html += `
                            <div class="event-item">
                                <div class="event-dot" style="background:${catInfo.color}"></div>
                                <div class="event-title">${escHtml(ev.title || catInfo.label)}</div>
                                ${ev.time ? `<div class="event-time">${escHtml(ev.time)}</div>` : ''}
                                <span class="event-cat-label ${ev.cat}">${catInfo.label}</span>
                                <button class="del-btn" onclick="delEvent('${k}',${actualIndex})" title="Remove">&#10005;</button>
                            </div>`;
                });
            }

            // Clear all button
            if (evs.length > 0) {
                html += `
                        <div style="display:flex;justify-content:flex-end;margin-top:0.75rem;">
                            <button class="clear-day-btn" onclick="clearDay('${k}')">Clear all</button>
                        </div>`;
            }

            // Add form
            html += `
                    <div class="add-form">
                        <input type="text" id="ev-title" placeholder="Note (optional)" />
                        <input type="time" id="ev-time" />
                        <select id="ev-cat">
                            <optgroup label="Regular Events">
                                <option value="personal">🌿 Personal</option>
                                <option value="work">💼 Work</option>
                                <option value="social">💜 Social</option>
                            </optgroup>
                            <optgroup label="Background Markers">
                                <option value="period">🩸 Period</option>
                                <option value="shower">🚿 Shower</option>
                                <option value="laundry">🧺 Laundry</option>
                                <option value="orange">🟠 Orange</option>
                                <option value="pink">🩷 Pink</option>
                            </optgroup>
                        </select>
                        <button class="add-btn" onclick="addEvent('${k}')">Add</button>
                    </div>`;

            list.innerHTML = html;

            const titleInput = document.getElementById('ev-title');
            const catSelect = document.getElementById('ev-cat');
            if (titleInput) {
                titleInput.addEventListener('keydown', e => {
                    if (e.key === 'Enter') addEvent(k);
                });
                if (catSelect) {
                    // Only auto-fill if empty
                    catSelect.addEventListener('change', () => {
                        if (!titleInput.value.trim()) {
                            const val = catSelect.value;
                            if (CATEGORIES[val]) {
                                titleInput.value = CATEGORIES[val].label;
                            }
                        }
                    });
                    // Initial fill
                    if (!titleInput.value.trim()) {
                        const val = catSelect.value;
                        if (CATEGORIES[val]) {
                            titleInput.value = CATEGORIES[val].label;
                        }
                    }
                }
                setTimeout(() => titleInput.focus(), 50);
            }
        }

        function addEvent(k) {
            const titleEl = document.getElementById('ev-title');
            const timeEl = document.getElementById('ev-time');
            const catEl = document.getElementById('ev-cat');
            let title = titleEl ? titleEl.value.trim() : '';
            const cat = catEl ? catEl.value : 'personal';

            if (!title) {
                title = CATEGORIES[cat] ? CATEGORIES[cat].label : 'Event';
            }

            const rawTime = timeEl ? timeEl.value : '';
            const time = rawTime ? formatTime(rawTime) : '';

            if (!events[k]) events[k] = [];
            events[k].push({ title, time, cat });
            saveEvents();
            render();
            renderEvents(k);
        }

        function delEvent(k, i) {
            if (!events[k]) return;
            events[k].splice(i, 1);
            if (events[k].length === 0) delete events[k];
            saveEvents();
            render();
            renderEvents(k);
        }

        function clearDay(k) {
            if (!events[k]) return;
            if (events[k].length === 0) return;
            if (!confirm('Remove all markers and events for this day?')) return;
            delete events[k];
            saveEvents();
            render();
            renderEvents(k);
        }

        function changeMonth(dir) {
            cur.m += dir;
            if (cur.m < 0) { cur.m = 11;
                cur.y--; }
            if (cur.m > 11) { cur.m = 0;
                cur.y++; }
            render();
        }

        function formatTime(t) {
            if (!t) return '';
            const [h, m] = t.split(':').map(Number);
            const ampm = h >= 12 ? 'PM' : 'AM';
            const hour = h % 12 || 12;
            return `${hour}:${String(m).padStart(2,'0')} ${ampm}`;
        }

        function escHtml(str) {
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        // ---- init ----
        loadEvents();

        // Select today by default
        const todayKey = key(today.getFullYear(), today.getMonth(), today.getDate());
        selected = { y: today.getFullYear(), m: today.getMonth(), d: today.getDate() };

        render();
        setTimeout(() => {
            renderEvents(todayKey);
            const dow = new Date(today.getFullYear(), today.getMonth(), today.getDate()).getDay();
            document.getElementById('panel-date').innerHTML =
                `${DAYS[dow]}, ${MONTHS[today.getMonth()]} ${today.getDate()} <span>— today</span>`;
        }, 10);
    </script>
</body>
</html>
